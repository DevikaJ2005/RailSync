<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 90" width="24" height="90">
  <defs>
    <!-- Realistic metallic gradient for aerodynamic body -->
    <linearGradient id="vbBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="10%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="90%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="vbBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="vbRoof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- === CAR 1: LEAD LOCOMOTIVE / CAB === -->
  <!-- Dark underframe drop shadow -->
  <rect x="2" y="3" width="20" height="40" rx="3" fill="#020617" opacity="0.6"/>

  <!-- Sleek aerodynamic bullet body with dark outline -->
  <path d="M 6 4 Q 12 1 18 4 Q 21 6 21 11 L 21 41 L 3 41 L 3 11 Q 3 6 6 4 Z"
        fill="url(#vbBody)" stroke="#0F172A" stroke-width="1"/>

  <!-- Royal Blue aero stripe on nose -->
  <path d="M 7 5 Q 12 2.5 17 5 L 18.5 10 L 5.5 10 Z" fill="url(#vbBlue)"/>

  <!-- High-visibility yellow safety beacon line -->
  <path d="M 8 9.5 L 16 9.5" stroke="#FACC15" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Wrap-around tinted aerodynamic windshield -->
  <path d="M 5 8 Q 12 6 19 8 L 19 12 Q 12 10 5 12 Z" fill="#020617"/>
  <path d="M 7 8.5 Q 12 7.2 17 8.5 L 17 10 Q 12 8.8 7 10 Z" fill="#38BDF8" opacity="0.85"/>

  <!-- High-intensity twin LED headlights -->
  <circle cx="6" cy="4.5" r="1.3" fill="#FEF08A"/>
  <circle cx="6" cy="4.5" r="0.8" fill="#FFFFFF"/>
  <circle cx="18" cy="4.5" r="1.3" fill="#FEF08A"/>
  <circle cx="18" cy="4.5" r="0.8" fill="#FFFFFF"/>

  <!-- Side speed livery stripes -->
  <rect x="3.2" y="14" width="1.8" height="26" fill="#1D4ED8"/>
  <rect x="19" y="14" width="1.8" height="26" fill="#1D4ED8"/>

  <!-- Roof aerodynamic AC pods & equipment -->
  <rect x="6.5" y="15" width="11" height="14" rx="1.5" fill="url(#vbRoof)" stroke="#334155" stroke-width="0.6"/>
  <line x1="8" y1="18" x2="16" y2="18" stroke="#334155" stroke-width="0.6"/>
  <line x1="8" y1="21" x2="16" y2="21" stroke="#334155" stroke-width="0.6"/>
  <line x1="8" y1="24" x2="16" y2="24" stroke="#334155" stroke-width="0.6"/>

  <!-- High-speed red pantograph assembly -->
  <line x1="7" y1="34" x2="17" y2="34" stroke="#EF4444" stroke-width="1" stroke-linecap="round"/>
  <line x1="8.5" y1="31" x2="15.5" y2="37" stroke="#475569" stroke-width="0.8"/>
  <line x1="15.5" y1="31" x2="8.5" y2="37" stroke="#475569" stroke-width="0.8"/>

  <!-- Flexible gangway inter-car coupler -->
  <rect x="7" y="41" width="10" height="4" fill="#1E293B" stroke="#0F172A" stroke-width="0.8"/>
  <rect x="8.5" y="41.5" width="7" height="3" fill="#020617"/>

  <!-- === CAR 2: PASSENGER COACH === -->
  <!-- Dark underframe drop shadow -->
  <rect x="2" y="45" width="20" height="42" rx="2" fill="#020617" opacity="0.6"/>

  <!-- Coach body with dark perimeter outline -->
  <rect x="3" y="45" width="18" height="42" rx="1.5" fill="url(#vbBody)" stroke="#0F172A" stroke-width="1"/>

  <!-- Coach livery side bands -->
  <rect x="3.2" y="45" width="1.8" height="42" fill="#1D4ED8"/>
  <rect x="19" y="45" width="1.8" height="42" fill="#1D4ED8"/>

  <!-- Dark continuous tinted panoramic windows -->
  <rect x="5.2" y="49" width="2" height="33" rx="0.5" fill="#0F172A"/>
  <rect x="16.8" y="49" width="2" height="33" rx="0.5" fill="#0F172A"/>
  <!-- Subtle warm interior glow in windows -->
  <rect x="5.4" y="50" width="1.4" height="31" fill="#BAE6FD" opacity="0.75"/>
  <rect x="17" y="50" width="1.4" height="31" fill="#BAE6FD" opacity="0.75"/>

  <!-- Coach roof vents and ribbed panels -->
  <rect x="7.5" y="50" width="9" height="14" rx="1" fill="url(#vbRoof)" stroke="#334155" stroke-width="0.5"/>
  <rect x="7.5" y="68" width="9" height="14" rx="1" fill="url(#vbRoof)" stroke="#334155" stroke-width="0.5"/>

  <!-- Red rear taillights -->
  <circle cx="6" cy="85.5" r="1.1" fill="#EF4444"/>
  <circle cx="18" cy="85.5" r="1.1" fill="#EF4444"/>
</svg>
